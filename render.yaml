services:
  - type: web
    name: ev-range-prediction
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt && python train_model.py"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --timeout 600 --workers 2 app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
